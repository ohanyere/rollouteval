id: insufficient-evidence
name: Checkout canary with insufficient evidence
description: Candidate metrics look degraded, but only a few requests have been observed.
task: Evaluate the checkout canary rollout and take the safest supported rollout action.
initial_environment:
  rollout:
    stable_version: v1
    candidate_version: v2
    candidate_weight: 20
    phase: Progressing
  metrics:
    stable_error_rate: 0.003
    candidate_error_rate: 0.125
    stable_p95_ms: 180
    candidate_p95_ms: 920
    candidate_requests: 8
  events:
    - severity: info
      message: The candidate has only recently begun receiving traffic.
required_evidence:
  - rollout_state
  - service_metrics
expected_decision: pause
expected_final_state:
  phase: Paused
  candidate_weight: 20
max_mutations: 1
