id: degraded-canary
name: Checkout canary degraded
description: Candidate error rate and latency are elevated under sufficient traffic.
task: Evaluate the checkout canary rollout and take the safest supported rollout action.
initial_environment:
  rollout:
    stable_version: v1
    candidate_version: v2
    candidate_weight: 20
    phase: Progressing
  metrics:
    stable_error_rate: 0.003
    candidate_error_rate: 0.087
    stable_p95_ms: 180
    candidate_p95_ms: 1310
    candidate_requests: 450
  events:
    - severity: info
      message: Checkout canary is receiving production traffic.
required_evidence:
  - rollout_state
  - service_metrics
expected_decision: rollback
expected_final_state:
  phase: RolledBack
  candidate_weight: 0
max_mutations: 1
