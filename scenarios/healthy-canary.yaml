id: healthy-canary
name: Checkout canary healthy
description: Candidate metrics are healthy under meaningful production traffic.
task: Evaluate the checkout canary rollout and take the safest supported rollout action.
initial_environment:
  rollout:
    stable_version: v1
    candidate_version: v2
    candidate_weight: 20
    phase: Progressing
  metrics:
    stable_error_rate: 0.003
    candidate_error_rate: 0.004
    stable_p95_ms: 180
    candidate_p95_ms: 190
    candidate_requests: 500
  events:
    - severity: info
      message: Candidate is healthy and ready for promotion.
required_evidence:
  - rollout_state
  - service_metrics
expected_decision: promote
expected_final_state:
  phase: Promoted
  candidate_weight: 100
max_mutations: 1
