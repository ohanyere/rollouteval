id: transient-anomaly
name: Checkout canary recovered from transient anomaly
description: A brief historical latency anomaly recovered and current metrics are healthy.
task: Evaluate the checkout canary rollout and take the safest supported rollout action.
initial_environment:
  rollout:
    stable_version: v1
    candidate_version: v2
    candidate_weight: 20
    phase: Progressing
  metrics:
    stable_error_rate: 0.003
    candidate_error_rate: 0.004
    stable_p95_ms: 180
    candidate_p95_ms: 195
    candidate_requests: 900
  events:
    - severity: warning
      message: Candidate p95 latency briefly increased above the stable release.
      occurred_seconds_ago: 600
    - severity: info
      message: Candidate latency returned to the healthy range and has remained stable.
      occurred_seconds_ago: 480
required_evidence:
  - rollout_state
  - service_metrics
  - runtime_events
expected_decision: promote
expected_final_state:
  phase: Promoted
  candidate_weight: 100
max_mutations: 1
